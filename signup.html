<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Khudha Lagse?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html"><span>🍴</span> Khudha Lagse<span class="logo-q">?</span></a>
      <a class="back-home" href="index.html">← Back to home</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="auth-card signup-card">
      <div class="auth-icon">🍽️</div>
      <span class="section-kicker">Join us</span>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Sign up and get delicious food delivered to your door.</p>
      <form id="signupForm" class="auth-form">
        <label>Full name<input id="signupName" type="text" placeholder="Your full name" required></label>
        <div class="two-fields">
          <label>Email<input id="signupEmail" type="email" placeholder="you@example.com" required></label>
          <label>Phone<input id="signupPhone" type="tel" placeholder="01XXXXXXXXX" required></label>
        </div>
        <label>Password<div class="password-wrap"><input id="signupPassword" type="password" placeholder="At least 6 characters" minlength="6" required><button type="button" class="password-toggle" data-target="signupPassword">👁</button></div></label>
        <label>Confirm password<div class="password-wrap"><input id="signupConfirm" type="password" placeholder="Repeat your password" minlength="6" required><button type="button" class="password-toggle" data-target="signupConfirm">👁</button></div></label>
        <label>Delivery address<input id="signupAddress" type="text" placeholder="House, road, area" required></label>
        <label class="checkbox terms"><input type="checkbox" required><span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>.</span></label>
        <button class="primary-btn" type="submit">Create account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
      <p class="form-message" id="signupMessage" role="status"></p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
